name: MenuLens
options:
  bundleIdPrefix: ai.xiangyang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  MenuLens:
    type: application
    platform: iOS
    sources:
      - MenuLens/Sources
      - path: MenuLens/Resources
        excludes:
          - "Samples/**"
      # Bundled sample scans, copied as a folder reference so the
      # per-sample subdirectories keep their structure in the app bundle.
      - path: MenuLens/Resources/Samples
        type: folder
    info:
      path: MenuLens/Info.plist
      properties:
        CFBundleDisplayName: MenuLens
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSCameraUsageDescription: 拍摄菜单照片，用于识别与翻译菜单内容。
        NSPhotoLibraryUsageDescription: 从相册选择菜单照片，用于识别与翻译菜单内容。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad must support all orientations (multitasking requirement).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Personal Team (向阳 史). Baked in so regenerated projects never ask
        # for the team again; teammates should override with their own.
        DEVELOPMENT_TEAM: LNP5ER743F
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
