name: MenuLens
options:
  bundleIdPrefix: ai.xiangyang
  # Base language is English: the strings in Info.plist below are the
  # fallback every device sees when it speaks none of our six languages.
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  MenuLens:
    type: application
    platform: iOS
    sources:
      - MenuLens/Sources
      - path: MenuLens/Resources
        excludes:
          - "Samples/**"
      # Bundled sample scans, copied as a folder reference so the
      # per-sample subdirectories keep their structure in the app bundle.
      - path: MenuLens/Resources/Samples
        type: folder
    info:
      path: MenuLens/Info.plist
      properties:
        CFBundleDisplayName: MenuLens
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSCameraUsageDescription: Used to photograph a restaurant menu so it can be read and translated.
        NSPhotoLibraryUsageDescription: Used to pick a menu photo from your library so it can be read and translated.
        # Declared explicitly so the App Store lists all six languages; the
        # per-language tables live in MenuLens/Resources/<lang>.lproj.
        CFBundleLocalizations:
          - en
          - zh-Hans
          - ja
          - ko
          - fr
          - es
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad must support all orientations (multitasking requirement).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Personal Team (向阳 史). Baked in so regenerated projects never ask
        # for the team again; teammates should override with their own.
        DEVELOPMENT_TEAM: LNP5ER743F
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
