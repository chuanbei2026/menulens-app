name: MenuLens
options:
  bundleIdPrefix: ai.xiangyang
  # Base language is English: the strings in Info.plist below are the
  # fallback every device sees when it speaks none of our six languages.
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  MenuLens:
    type: application
    platform: iOS
    scheme:
      # Local StoreKit testing (Xcode runs on a simulator): the credit packs
      # without App Store Connect. Such transactions are signed by Xcode, not
      # Apple, so POST /purchase rejects them (bad_jws) — expected.
      storeKitConfiguration: MenuLens/Products.storekit
      testTargets: [MenuLensTests, MenuLensUITests]
    sources:
      - MenuLens/Sources
      - path: MenuLens/Resources
        excludes:
          - "Samples/**"
      # Bundled sample scans, copied as a folder reference so the
      # per-sample subdirectories keep their structure in the app bundle.
      - path: MenuLens/Resources/Samples
        type: folder
    # Sign in with Apple: the account behind the backend's credits. XcodeGen
    # writes this file from the properties below.
    entitlements:
      path: MenuLens/MenuLens.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: MenuLens/Info.plist
      properties:
        # Marketing name. The Xcode project, target, paths and bundle id
        # deliberately keep the old name — none of them is user-visible.
        CFBundleDisplayName: ForeignMenu
        # Driven by the build settings below, NOT hardcoded — the generated
        # Info.plist used to carry a literal 1.0/1, which meant
        # MARKETING_VERSION was dead and bumping it shipped nothing.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSCameraUsageDescription: Used to photograph a restaurant menu so it can be read and translated.
        NSPhotoLibraryUsageDescription: Used to pick a menu photo from your library so it can be read and translated.
        # Declared explicitly so the App Store lists all six languages; the
        # per-language tables live in MenuLens/Resources/<lang>.lproj.
        CFBundleLocalizations:
          - en
          - zh-Hans
          - zh-Hant
          - ja
          - ko
          - fr
          - es
          - hi
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad must support all orientations (multitasking requirement).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Paid individual team (Xiangyang Shi). Baked in so regenerated
        # projects never ask for the team again; teammates should override
        # with their own. App Store export needs -allowProvisioningUpdates
        # the first time, so xcodebuild can create the store profile.
        DEVELOPMENT_TEAM: LNP5ER743F
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: "1.1"

  # Hosted unit tests. ShopTests drives the credit shop against the live
  # backend with StoreKit served from Products.storekit (see the file).
  MenuLensTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MenuLensTests
      - path: MenuLens/Products.storekit
        buildPhase: resources
    dependencies:
      - target: MenuLens
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LNP5ER743F

  # Gesture checks of the result screen (swipe between status / canvas /
  # list, the bottom bar, retry a page) on the free -demoScan pipeline.
  MenuLensUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MenuLensUITests
    dependencies:
      - target: MenuLens
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LNP5ER743F
        TEST_TARGET_NAME: MenuLens
